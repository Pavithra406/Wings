<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="leave">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><p class="eyebrow"></p><h2 style="margin:0;font-size:1.1rem;">Leave Register</h2></div>
      <nav class="nav-links">
        <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="mess-menu.html"><span class="nav-icon">🍽</span> Mess Menu</a>
        <a href="complaint.html"><span class="nav-icon">🛠</span> Complaints</a>
        <a href="gatepass.html"><span class="nav-icon">🚪</span> Gate Pass</a>
        <a href="leave.html" class="active"><span class="nav-icon">🗓</span> Leave</a>
        <a href="roomswap.html"><span class="nav-icon">🛏</span> Room Swap</a>
        <a href="holidays.html"><span class="nav-icon">📅</span> Holidays</a>
        <a href="feedback.html"><span class="nav-icon">⭐</span> Food Feedback</a>
      </nav>
      <div class="sidebar-footer"><a href="login.html" class="action-btn secondary-btn" style="width:100%;justify-content:center;border-radius:14px;">🚪 Logout</a></div>
    </aside>
    <main class="content-area two-col">
      <section class="panel">
        <p class="eyebrow">Leave Form</p>
        <h1>Request Leave</h1>
        <p class="panel-note">Leave requires both parent confirmation and admin approval before it is granted.</p>
        <form id="leaveForm" class="stack-form">
          <label><span>Student Name</span><input type="text" name="studentName" id="lStudentName" placeholder="Auto-filled" readonly style="opacity:0.7;cursor:not-allowed;"></label>
          <label><span>Room Number</span><input type="text" name="roomNumber" id="lRoomNumber" placeholder="Auto-filled" readonly style="opacity:0.7;cursor:not-allowed;"></label>
          <label><span>Leave From Date</span><input type="date" name="fromDate" required></label>
          <label><span>Leave To Date</span><input type="date" name="toDate" required></label>
          <label><span>Reason</span><textarea name="reason" rows="4" placeholder="Reason for leave..." required></textarea></label>
          <button type="submit" class="primary-btn" style="justify-content:center;">🗓 Submit Leave</button>
        </form>
        <p id="leaveMessage" class="inline-message"></p>
      </section>
      <section class="panel">
        <p class="eyebrow">Leave History</p>
        <h2>Request Log</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>From</th><th>To</th><th>Reason</th><th>Parent</th><th>Status</th></tr>
            </thead>
            <tbody id="leaveTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
