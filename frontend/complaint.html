<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="complaint">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><p class="eyebrow"></p><h2 style="margin:0;font-size:1.1rem;">Maintenance</h2></div>
      <nav class="nav-links">
        <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="mess-menu.html"><span class="nav-icon">🍽</span> Mess Menu</a>
        <a href="complaint.html" class="active"><span class="nav-icon">🛠</span> Complaints</a>
        <a href="gatepass.html"><span class="nav-icon">🚪</span> Gate Pass</a>
        <a href="leave.html"><span class="nav-icon">🗓</span> Leave</a>
        <a href="roomswap.html"><span class="nav-icon">🛏</span> Room Swap</a>
        <a href="holidays.html"><span class="nav-icon">📅</span> Holidays</a>
        <a href="feedback.html"><span class="nav-icon">⭐</span> Food Feedback</a>
      </nav>
      <div class="sidebar-footer"><a href="login.html" class="action-btn secondary-btn" style="width:100%;justify-content:center;border-radius:14px;">🚪 Logout</a></div>
    </aside>
    <main class="content-area two-col">
      <section class="panel">
        <p class="eyebrow">Report Issue</p>
        <h1>Complaint Management</h1>
        <p class="panel-note">Submit your complaint and track its resolution. Our maintenance team will respond promptly.</p>
        <form id="complaintForm" class="stack-form">
          <label><span>Room Number</span><input type="text" name="roomNumber" placeholder="e.g. A-204" required></label>
          <label>
            <span>Complaint Type</span>
            <select name="complaintType" required>
              <option value="">Select type...</option>
              <option value="Electrical">⚡ Electrical</option>
              <option value="Water">💧 Water</option>
              <option value="Furniture">🪑 Furniture</option>
              <option value="Other">📋 Other</option>
            </select>
          </label>
          <label><span>Issue Description</span><textarea name="issueDescription" rows="5" placeholder="Describe the issue in detail..." required></textarea></label>
          <button type="submit" class="primary-btn" style="justify-content:center;">🛠 Submit Complaint</button>
        </form>
        <p id="complaintMessage" class="inline-message"></p>
      </section>
      <section class="panel">
        <p class="eyebrow">Current Status</p>
        <h2>Complaint History</h2>
        <div id="complaintList" class="feed-list"></div>
      </section>
    </main>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
